<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Metallic Platinum-Silver Gradient -->
    <linearGradient id="rMetallicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#F1F5F9"/>
      <stop offset="65%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Subtle Cinematic Film Accent (Cool Blue to Champagne Gold) -->
    <linearGradient id="rFilmAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#CBD5E1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E2B774" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Ambient Glow on Dark Background -->
    <radialGradient id="rAtmosphere" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.18)"/>
      <stop offset="65%" stop-color="rgba(226, 183, 116, 0.05)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Subtle Bevel Highlight for Monogram -->
    <linearGradient id="rBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.8)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.1)"/>
    </linearGradient>
  </defs>

  <!-- Dark Cinematic Squircle Plaque -->
  <rect x="3" y="3" width="94" height="94" rx="22" fill="#06090F" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2"/>
  <rect x="4" y="4" width="92" height="92" rx="21" fill="url(#rAtmosphere)"/>
  <rect x="3" y="3" width="94" height="94" rx="22" fill="none" stroke="url(#rFilmAccent)" stroke-width="0.8" opacity="0.45"/>

  <!-- Master Monogram "R" -->
  <path d="M 26 22 H 63 C 74.5 22 81 29 81 38.5 C 81 46.5 75 52 64.5 53.5 L 78 78 H 63.5 L 51.5 55 H 38 V 78 H 26 V 22 Z M 38 32 V 45 H 61 C 65.5 45 69 42.5 69 38.5 C 69 34.5 65.5 32 61 32 H 38 Z" fill="url(#rMetallicGrad)" fill-rule="evenodd"/>

  <!-- Left Precision Hairline Accent -->
  <line x1="26" y1="23" x2="26" y2="77" stroke="url(#rFilmAccent)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Top-Right Specular Light Highlight Point -->
  <circle cx="63" cy="22" r="1.5" fill="#FFFFFF" opacity="0.9"/>
</svg>
